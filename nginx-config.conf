server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Configuration pour les uploads de grandes tailles
    client_max_body_size 100M;

    # Frontend - Marketplace interface
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API - Marketplace API
    location /api/ {
        proxy_pass http://localhost:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenStack Dashboard (Horizon) - IMPORTANT: proxy_redirect pour réécrire
    # les redirections Horizon (sinon le navigateur reçoit Location: http://localhost:8080/... et échoue)
    location /dashboard {
        proxy_pass http://127.0.0.1:8080/dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect http://127.0.0.1:8080/ $scheme://$host/;
        proxy_redirect http://localhost:8080/ $scheme://$host/;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # OpenStack Dashboard static files
    location /static {
        proxy_pass http://127.0.0.1:8080/static;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://127.0.0.1:8080/ $scheme://$host/;
        proxy_redirect http://localhost:8080/ $scheme://$host/;
    }

    # OpenStack API endpoints
    location /identity {
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # noVNC proxy (optionnel): permet de rendre la console Nova joignable depuis le navigateur
    # Exposer ensuite NOVNC_PUBLIC_BASE_URL=http://<host>/novnc dans Backend/.env
    location /novnc/ {
        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

